name: Build-Release

# 触发方式:
#   1. 推送 v* 标签 (例如 v0.1) -> 构建 APK 并创建/更新对应的 GitHub Release
#   2. 手动 workflow_dispatch -> 只构建并上传 artifact, 不创建 Release (冒烟验证用)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 必须为 0: buildSrc/Git.kt 用 `git describe --tags --exact-match` 判断是否处于标签上,
          # 浅克隆拿不到 tag, 会导致 versionName 被追加 "-<sha7>" 后缀
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 仓库配了签名密钥就用密钥签名, 否则回落到 debug 签名 (gkd-app/build.gradle.kts 内置回退逻辑)
      - name: Decode keystore from secrets
        id: ks
        env:
          GKD_STORE_FILE_BASE64: ${{ secrets.GKD_STORE_FILE_BASE64 }}
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
        run: |
          if [ -z "$GKD_STORE_FILE_BASE64" ]; then
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=未配置签名密钥::未找到 GKD_STORE_FILE_BASE64, 本次使用 debug 签名"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE="$RUNNER_TEMP/signing/gkd-release.p12"
          printf '%s' "$GKD_STORE_FILE_BASE64" | base64 --decode > "$KEYSTORE"
          # 先校验密钥可读, 避免跑完大半个构建才在签名阶段失败
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$GKD_STORE_PASSWORD" -alias "$GKD_KEY_ALIAS"
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Build release APK (repo keystore)
        if: steps.ks.outputs.ready == '1'
        env:
          GKD_RENAME_APK_FLAG: "1"
          GKD_STORE_FILE: ${{ steps.ks.outputs.keystore }}
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
        run: ./gradlew :gkd-app:assembleGkdRelease --stacktrace

      - name: Build release APK (debug signature fallback)
        if: steps.ks.outputs.ready != '1'
        env:
          GKD_RENAME_APK_FLAG: "1"
        run: ./gradlew :gkd-app:assembleGkdRelease --stacktrace

      - name: Collect APK
        id: apk
        run: |
          SRC=$(find gkd-app/build/outputs/apk/gkd/release -name '*.apk' | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::未找到构建产物 APK"
            find gkd-app/build/outputs -type f | head -50
            exit 1
          fi
          mkdir -p out
          NAME=$(basename "$SRC")
          cp "$SRC" "out/$NAME"
          echo "path=out/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -l out

      # 应用内「检查更新」读取的就是这个 index.json (见 gkd-app 的 li.gkd.app.util.Upgrade)
      # 它以 Release 资产的形式发布, 因此更新检查的地址可以是一个固定的
      # https://github.com/<owner>/<repo>/releases/latest/download/index.json
      - name: Generate release index
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # 上一个 tag 用于校验「关于」页的「上次更新」版本号是否已同步
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1)
          echo "prev tag = ${PREV_TAG:-<none>}"
          python3 tools/gen_release_index.py \
            --apk "${{ steps.apk.outputs.path }}" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --changelog CHANGELOG.md \
            --gradle-file gkd-app/build.gradle.kts \
            --prev-tag "$PREV_TAG" \
            --out-index out/index.json \
            --out-notes out/release_notes.md
          cat out/index.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gkd-pure-${{ github.ref_name }}
          path: out/*
          if-no-files-found: error

      - name: Create Release
        # 只在推送 v* 标签时发布; 此前没有这个限制, 推 main 也会走到这里
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.path != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # 同名 release 已存在时先删掉重建; release delete 不会删除 tag 本身
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "existing release $TAG found, replacing it"
            gh release delete "$TAG" --yes
          fi
          {
            echo ""
            echo "### 构建信息"
            echo ""
            echo "- 提交: [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- 构建日志: [Actions run #${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> out/release_notes.md
          cat out/release_notes.md
          # index.json 必须与 APK 一起发布: 应用内检查更新读取的就是它
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            out/index.json \
            --target "${{ github.sha }}" \
            --title "gkd_pure $TAG" \
            --notes-file out/release_notes.md \
            --latest
