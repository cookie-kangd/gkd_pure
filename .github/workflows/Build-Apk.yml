name: Build-Apk

# 只在**功能分支**推送时做一次快照构建 (只上传 artifact, 不创建 Release)。
# 提交信息以 chore: / chore( 开头会被跳过, 适合只改文档或配置的场景。
#
# ⚠️ 刻意排除 main:
#   发版流程是「推 main + 推 vX.Y.Z 标签」, 标签那一次由 Build-Release.yml 负责构建并发布。
#   如果这里也监听 main, 同一次发版就会并排跑两个几乎一样的构建（两个分支各一个 run）,
#   既浪费 Actions 额度又让人分不清哪个才是发布产物。
#   而且 main 的编译正确性由紧随其后的标签构建覆盖, 不需要重复验证。
#   功能分支(如 deps/xxx)仍然会跑, 用作合并前的编译冒烟测试。
on:
  workflow_dispatch:

  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore from secrets
        id: ks
        env:
          GKD_STORE_FILE_BASE64: ${{ secrets.GKD_STORE_FILE_BASE64 }}
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
        run: |
          if [ -z "$GKD_STORE_FILE_BASE64" ]; then
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=未配置签名密钥::未找到 GKD_STORE_FILE_BASE64, 本次使用 debug 签名"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE="$RUNNER_TEMP/signing/gkd-release.p12"
          printf '%s' "$GKD_STORE_FILE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$GKD_STORE_PASSWORD" -alias "$GKD_KEY_ALIAS"
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Build release APK (repo keystore)
        if: steps.ks.outputs.ready == '1'
        env:
          GKD_RENAME_APK_FLAG: "1"
          GKD_STORE_FILE: ${{ steps.ks.outputs.keystore }}
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
        run: ./gradlew :gkd-app:assembleGkdRelease --stacktrace

      - name: Build release APK (debug signature fallback)
        if: steps.ks.outputs.ready != '1'
        env:
          GKD_RENAME_APK_FLAG: "1"
        run: ./gradlew :gkd-app:assembleGkdRelease --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gkd-apk-${{ github.sha }}
          path: gkd-app/build/outputs/apk/gkd/release/*.apk
          if-no-files-found: error
